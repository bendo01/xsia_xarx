# Ferron 3 configuration. See https://ferron.sh/docs for the reference.
# Validate with: ferron validate -c ferron.conf

# Global configuration.
{
    observability {
        provider file
        access_log /var/log/ferron/access.log
        error_log /var/log/ferron/error.log
    }
}

# CORS headers for static sites
snippet cors_headers {
    header "Access-Control-Allow-Origin" "*"
    header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS"
    header "Access-Control-Allow-Headers" "Authorization, Content-Type, X-Requested-With"
    header "Access-Control-Max-Age" "86400"
}

# Catch-all HTTP host.
# Named hosts below get automatic TLS (Let's Encrypt) by default, so the
# old `* { auto_tls }` block is no longer needed.
# WARNING: /var/www/ferron also contains the app directory (see DEPLOYMENT.md);
# remove or change this block if you deploy there.
*:80 {
    root "/var/www/ferron"
}

tritunas.ac.id {
    root "/var/www/html/profile_tritunas"
    rewrite r"^/.*" "/" {
        directory false
        file false
        last
    }
    compressed
    use cors_headers
}

pmb.tritunas.ac.id {
    root "/var/www/html/admission_tritunas"
    rewrite r"^/.*" "/" {
        directory false
        file false
        last
    }
    compressed
    use cors_headers
}

# SolidStart SSR (Nitro on Bun, 127.0.0.1:3000). Not a static site: /_build/assets/*
# must come from the SSR server, otherwise the SPA rewrite answers them with HTML.
# No cors_headers here (see DEPLOYMENT.md section 9).
siaka.tritunas.ac.id {
    proxy "http://127.0.0.1:3000"
    compressed
}

api.siaka.tritunas.ac.id {
    proxy "http://localhost:5150"
}

# OpenWA (Docker container openwa-api, bound to 127.0.0.1:2785)
openwa.xsia.app {
    compressed
    proxy "http://127.0.0.1:2785"
}

lms.mipa.xsia.app {
    root "/var/www/html/moodle/public"

    # Moodle front controller: route missing files/directories to r.php
    rewrite r"^/(.*)$" "/r.php" {
        file false
        directory false
        last
    }

    fcgi_php "unix:///run/php/php8.4-fpm.sock"
}

server.internal.tritunas.ac.id {
    proxy "http://127.0.0.1:9090/"
}

spada.tritunas.ac.id {
    root "/var/www/ferron/spada_tritunas/public"
    fcgi_php "unix:///var/opt/remi/php84/run/php-fpm/www.sock"
}

perpustakaan.tritunas.ac.id {
    root "/var/www/ferron/perpustakaan_tritunas"
    fcgi_php "unix:///var/opt/remi/php85/run/php-fpm/www.sock"
}

journal.tritunas.ac.id {
    root "/var/www/ferron/journal_tritunas"
    fcgi_php "unix:///var/opt/remi/php85/run/php-fpm/www.sock"
}

journalv2.tritunas.ac.id {
    root "/var/www/ferron/journalv2_tritunas"
    fcgi_php "unix:///var/opt/remi/php85/run/php-fpm/www.sock"
}
